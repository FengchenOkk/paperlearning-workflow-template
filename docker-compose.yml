services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: papergraph
      POSTGRES_USER: papergraph
      POSTGRES_PASSWORD: ${PAPERGRAPH_DB_PASSWORD:-local-development-only}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papergraph"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &app-environment
      PAPERGRAPH_DATABASE_URL: postgresql+psycopg://papergraph:${PAPERGRAPH_DB_PASSWORD:-local-development-only}@database/papergraph
      PAPERGRAPH_STORAGE_DIR: /app/data/documents
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    command: ["python", "-m", "uvicorn", "papergraph.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - documents:/app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    command: ["python", "-m", "papergraph.worker"]
    environment: *app-environment
    volumes:
      - documents:/app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres:
  documents:
