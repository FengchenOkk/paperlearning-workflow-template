name: PaperGraph checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt PyYAML
      - run: python evals/download_fixture.py
      - run: python evals/download_fixture.py gw150914
      - run: ruff check . && ruff format --check . && mypy papergraph && pytest -q
        working-directory: backend
      - run: python -m scripts.export_contracts --check && alembic upgrade head && alembic check
        working-directory: backend
      - run: python -m unittest discover -s tests > /tmp/legacy-tests.log 2>&1
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: node scripts/generate-contracts.mjs --check
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python evals/download_fixture.py
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: python scripts/run_e2e.py
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
