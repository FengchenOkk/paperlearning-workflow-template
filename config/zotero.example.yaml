zotero:
  enabled: false
  mode: local
  local:
    base_url: http://127.0.0.1:23119/api/users/0
    timeout_seconds: 10
  web:
    library_type: user
    library_id: TODO(user)
    api_key_env: ZOTERO_API_KEY
    timeout_seconds: 10
  export:
    path: TODO(user)
